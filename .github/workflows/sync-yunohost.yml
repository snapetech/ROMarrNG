name: sync-yunohost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yunohost-sync-main
  cancel-in-progress: false

jobs:
  sync-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out YunoHost package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YunoHost-Apps/romarrng_ynh
          ref: testing
          path: romarrng_ynh
          token: ${{ secrets.YUNOHOST_REPO_TOKEN }}
          persist-credentials: true

      - name: Sync package from main
        env:
          ROMARRNG_YNH_REPO: ${{ github.workspace }}/romarrng_ynh
          ROMARRNG_YNH_BRANCH: testing
        run: bash scripts/sync-yunohost-package.sh
