name: docker

# Tests gate the image. A published `latest` that fails its own suite is worse
# than no published image, because somebody else is now running it.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer main push supersedes its old image; never let an older build
# finish later and overwrite latest. Tag builds keep separate groups.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-notes:
    name: Release-note contract
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          python scripts/release_notes.py check \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          python scripts/release_notes.py check-changelog-tags

  test:
    # Pull requests and tags stay hosted. The organization runner group is
    # server-restricted to this workflow on main before trusted main runs use it.
    runs-on: ${{ (((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && vars.TRUSTED_MAIN_RUNNERS_ENABLED == 'true' && fromJSON('{"group":"trusted-main","labels":["self-hosted","Linux","X64","host"]}')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test private runner temporary storage setup
        if: runner.os == 'Linux'
        run: ./scripts/test-private-runner-temp.sh

      - name: Configure private runner temporary storage
        id: private-runner-temp
        if: runner.os == 'Linux'
        env:
          PRIVATE_RUNNER_TEMP_PREFIX: romarr
        run: ./scripts/prepare-private-runner-temp.sh

      - name: Set up Python 3.13 on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # setup-python's Linux builds target GitHub-hosted distributions. The Arch pool
      # runner installs a managed interpreter beneath this job's private temp path.
      - name: Install uv for the self-hosted Python runtime
        if: runner.environment == 'self-hosted'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Install Python 3.13 in private runner storage
        if: runner.environment == 'self-hosted'
        env:
          UV_CACHE_DIR: ${{ steps.private-runner-temp.outputs.path }}/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ steps.private-runner-temp.outputs.path }}/python
        run: |
          set -euo pipefail
          umask 077
          uv python install 3.13
          python_bin="$(uv python find 3.13)"
          [[ "$python_bin" == "$UV_PYTHON_INSTALL_DIR/"* && -x "$python_bin" ]]
          printf '%s\n' "$(dirname "$python_bin")" >> "$GITHUB_PATH"
          "$python_bin" --version

      - name: Run source-bound pytest validation
        env:
          VALIDATION_NODE_ID: romarrng-pytest-linux
          VALIDATION_RECEIPT_EXPORT: ${{ steps.private-runner-temp.outputs.path || runner.temp }}/romarr-validation/pytest.json
        run: python3.13 -m scripts.validation_engine.engine --tests-only

      - name: Stage failed pytest task logs
        if: always()
        env:
          PRIVATE_RUNNER_TEMP: ${{ steps.private-runner-temp.outputs.path || runner.temp }}
          VALIDATION_RECEIPT_EXPORT: ${{ steps.private-runner-temp.outputs.path || runner.temp }}/romarr-validation/pytest.json
        run: python3.13 -m scripts.validation_engine.retain_failed_pytest_logs

      - name: Retain pytest validation receipt and failed task logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: romarrng-validation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.private-runner-temp.outputs.path || runner.temp }}/romarr-validation/pytest.json
            ${{ steps.private-runner-temp.outputs.path || runner.temp }}/romarr-validation/failed-task-logs/manifest.json
            ${{ steps.private-runner-temp.outputs.path || runner.temp }}/romarr-validation/failed-task-logs/*.log
          if-no-files-found: warn
          retention-days: 7
  validation-environment-portability:
    name: Validation child environment (${{ matrix.os }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Probe the real validation child environment
        run: >-
          python -m pytest tests/test_validation_engine.py -q
          -k validation_child_process_environment_is_allowlisted
      - name: Verify sandbox path policy with native Windows Node
        if: runner.os == 'Windows'
        run: node --test scripts/validation_engine/trusted-test-launcher.contract.mjs

  acquisition-proof:
    name: Packaged acquisition (${{ matrix.dockerfile }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native test image
        run: docker build --build-arg TARGETARCH=amd64 -f "${{ matrix.dockerfile }}" -t romarrng:acquisition-proof .
      - name: Prove sandboxed acquisition and SeerrNG delivery
        run: >-
          docker run --rm -e PYTHONPATH=/app --entrypoint python
          -v "$PWD/scripts:/proof:ro" romarrng:acquisition-proof
          /proof/prove_upstream_acquisition.py

  image:
    needs: [test, release-notes, acquisition-proof]
    if: always() && needs.test.result == 'success' && needs.acquisition-proof.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download current-run test receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.3.0
        with:
          name: romarrng-validation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/romarr-validation

      - name: Verify run, attempt, source and pytest inventory
        run: >-
          python -m scripts.validation_engine.reconcile
          --receipt "$RUNNER_TEMP/romarr-validation/pytest.json"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --sha "$GITHUB_SHA"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' romarr/app.py | head -n 1)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match ROMarr.VERSION $version."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag $TAG is not on main."
            exit 1
          }

      # armv7 has no musl wheel for charset-normalizer, so that leg compiles
      # under emulation. It is the slow one; the others are native-speed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The suite gates the code; nothing gated the image. A broken entrypoint,
      # a dependency that failed to install, or a missing bsdtar would all pass
      # every test and publish anyway -- and the first person to find out would
      # be somebody who pulled it. So one leg is built, booted and questioned
      # before anything is pushed. The multi-arch build below reuses this
      # build's cache, so the cost is close to nothing.
      - name: Build the amd64 leg for a smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: romarr:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Boot the image and ask it whether it is alive
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/romarr-config" "$RUNNER_TEMP/romarr-roms" \
                   "$RUNNER_TEMP/romarr-downloads"
          printf 'download fixture' > "$RUNNER_TEMP/romarr-downloads/source.rar"
          chmod 0775 "$RUNNER_TEMP/romarr-downloads/source.rar"
          before=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          docker run -d --name smoke -p 6868:6868 \
            --read-only --cap-drop ALL --cap-add CHOWN --cap-add SETGID \
            --cap-add SETUID --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            -e PUID=1000 -e PGID=1000 -e UMASK=002 \
            -v "$RUNNER_TEMP/romarr-config:/config" \
            -v "$RUNNER_TEMP/romarr-roms:/roms" \
            -v "$RUNNER_TEMP/romarr-downloads:/downloads" \
            romarr:smoke
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:6868/api/health && break
            sleep 2
          done

          echo "--- liveness ---"
          curl -fsS http://127.0.0.1:6868/api/health

          # No credential is set anywhere in this job, deliberately. An open
          # install is the failure mode that matters most for an image people
          # put on their LAN, and it is checkable without one.
          echo "--- the gate is on ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 http://127.0.0.1:6868/api/v1/system/status)
          test "$code" = "401" || { echo "status answered $code, not 401"; exit 1; }

          # bsdtar is not optional: without it every disc-platform import fails
          # on a format it cannot open, and nothing else in this job would
          # notice its absence.
          echo "--- the pieces that are easy to lose ---"
          docker exec smoke sh -c 'command -v bsdtar >/dev/null' \
            || { echo "bsdtar missing"; exit 1; }
          docker exec smoke sh -c 'command -v git >/dev/null' \
            || { echo "git missing; catalogue plugins cannot install"; exit 1; }
          docker exec smoke python -c "import requests, rom_hub; from rom_hub.sandbox import install; install()" \
            || { echo "a dependency did not install"; exit 1; }
          docker exec smoke python -c "from pathlib import Path; from rom_hub.catalog_sources import load_all; c=load_all(Path('/tmp/hub-smoke')); print(f'{len(c.entries)} bundled plugins'); assert c.entries" \
            || { echo "ROM Hub installed without its plugin catalogue"; exit 1; }
          docker exec smoke sh -c 'ROM_HUB_HOME=/tmp/hub-install rom-hub plugin install archive-org' \
            || { echo "bundled Archive.org plugin did not install"; exit 1; }

          echo "--- privileges were dropped ---"
          docker logs smoke 2>&1 | grep -q "starting as 1000:1000 with umask 002" \
            || { echo "entrypoint did not drop to PUID:PGID"; exit 1; }

          echo "--- mounted downloads were not rewritten ---"
          after=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          test "$after" = "$before" \
            || { echo "source permissions changed: $before -> $after"; exit 1; }
          test "$(awk '/^Umask:/ {print $2}' /proc/$(docker inspect -f '{{.State.Pid}}' smoke)/status)" = "0002" \
            || { echo "server process did not inherit UMASK=002"; exit 1; }

          docker rm -f smoke

      - name: Build all supported platforms without publishing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  image_publish:
    needs: [image]
    if: always() && needs.image.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this fork's image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=ROMarrNG
            org.opencontainers.image.description=ROMarrNG adds a SeerrNG request and library contract to ROMarr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/romarrng-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/romarrng-image.spdx.json
          push-to-registry: true

  # Debian variant for the optional Playwright download client. Keep it on
  # separate tags so the default Alpine image and `latest` remain unchanged.
  image-browser:
    name: Browser image validation
    needs: [image, release-notes]
    if: always() && needs.image.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build browser image for all supported platforms without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: false
          tags: romarrng:browser-validation
          cache-from: type=gha,scope=browser
          cache-to: type=gha,scope=browser,mode=max
          provenance: false

  image_browser_publish:
    needs: [image, release-notes]
    if: always() && github.event_name != 'pull_request' && needs.image.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this fork's image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=ROMarrNG (browser edition)
            org.opencontainers.image.description=ROMarrNG on Debian with the Playwright client for the Headless Browser download client
          tags: |
            type=raw,value=browser,enable={{is_default_branch}}
            type=semver,pattern={{version}}-browser
            type=semver,pattern={{major}}.{{minor}}-browser
            type=sha,format=short,suffix=-browser

      - name: Build and push browser edition
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,scope=browser,mode=max
          provenance: false

      - name: Generate browser image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/romarrng-browser-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest browser image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest browser image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/romarrng-browser-image.spdx.json
          push-to-registry: true

  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.image_publish.result == 'success' && needs.image_browser_publish.result == 'success'
    needs: [image_publish, image_browser_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changelog tag coverage
        run: python scripts/release_notes.py check-changelog-tags

      - name: Extract changelog entry
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { copying = 1; found = 1; print; next }
            copying && /^## \[/ { exit }
            copying { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^")"
          python scripts/release_notes.py assemble \
            --previous-tag "$previous_tag" \
            --head "$GITHUB_SHA" \
            --changelog release-notes.md \
            --output release-notes.md \
            --require-prepared-changelog
          {
            echo ""
            echo "**Container image**: \`${IMAGE}:${VERSION}\`"
            echo "- Browser edition: \`${IMAGE}:${VERSION}-browser\` (AMD64/ARM64; Playwright client only)"
            echo "- [GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/romarrng)"
            echo ""
            echo "Pull with: \`docker pull ${IMAGE}:${VERSION}\`."
          } >> release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ROMarrNG ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false

      - name: Announce release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release.' >&2
            exit 1
          }
          version="${TAG#v}"
          image_ref="${IMAGE}:${version}"
          python scripts/release_notes.py split-discord --input release-notes.md > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          (( chunk_count > 0 )) || {
            echo 'The generated release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index++)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="ROMarrNG ${TAG} release notes (${number}/${chunk_count})"
            jq -n \
              --arg username "ROMarrNG Releases" \
              --arg title "$title" \
              --arg url "$RELEASE_URL" \
              --arg description "$description" \
              --arg image "$image_ref" \
              --arg workflow "$WORKFLOW_URL" \
              --argjson first "$index" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  fields: (if $first == 0 then [
                    { name: "Image", value: $image, inline: false },
                    { name: "Workflow", value: $workflow, inline: false }
                  ] else [] end)
                }]
              }' > payload.json

            response="$(curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done
