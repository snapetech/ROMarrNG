version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Regina
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /scripts/launchbox_proof
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      launchbox-proof-nuget-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      launchbox-proof-nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /contrib/launchbox
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      launchbox-plugin-nuget-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      launchbox-plugin-nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:15"
      timezone: America/Regina
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      compose-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: America/Regina
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
