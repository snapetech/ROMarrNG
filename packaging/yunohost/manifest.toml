#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "romarrng"
name = "ROMarrNG"
description.en = "Game ROM discovery, acquisition, and library management"
version = "0.12.2~ynh1"
maintainers = ["snapetech"]

[upstream]
license = "MIT"
website = "https://github.com/snapetech/ROMarrNG"
userdoc = "https://github.com/snapetech/ROMarrNG#yunohost"
admindoc = "https://github.com/snapetech/ROMarrNG/blob/main/packaging/yunohost/doc/ADMIN.md"
code = "https://github.com/snapetech/ROMarrNG"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "1G"
ram.build = "150M"
ram.runtime = "512M"

[install]
  [install.domain]
  type = "domain"

  [install.path]
  type = "path"
  default = "/"
  pattern = { regexp = "^/$", error = "ROMarrNG must be installed at the root of a dedicated domain; URL subpaths are not supported." }

  [install.init_main_permission]
  type = "group"
  default = "admins"

[resources]
  [resources.sources]
    [resources.sources.main]
    in_subdir = true
    format = "tar.gz"
    url = "https://github.com/snapetech/ROMarrNG/archive/refs/tags/v0.12.2.tar.gz"
    sha256 = "4a5bc0b07df8d1a51bf704396b5fa8fabf37c0c2a0be8d0a858c35003a7f1d64"
    autoupdate.strategy = "latest_github_tag"

    [resources.sources.uv]
    in_subdir = true
    format = "tar.gz"
    amd64.url = "https://github.com/astral-sh/uv/releases/download/0.12.18/uv-x86_64-unknown-linux-gnu.tar.gz"
    amd64.sha256 = "89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16"
    arm64.url = "https://github.com/astral-sh/uv/releases/download/0.12.18/uv-aarch64-unknown-linux-gnu.tar.gz"
    arm64.sha256 = "afb6291f3f0a6b4521fc67b947822506c41dde5b60d2189dd8f3695b2ac8c9e7"
    autoupdate.upstream = "https://github.com/astral-sh/uv"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^uv-x86_64-unknown-linux-gnu\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^uv-aarch64-unknown-linux-gnu\\.tar\\.gz$"

  [resources.system_user]

  [resources.install_dir]

  [resources.data_dir]

  [resources.permissions]
  main.url = "/"
  main.auth_header = false
  main.show_tile = true

  [resources.ports]
  main.default = 6868

  [resources.apt]
    packages = "git, libarchive-tools, libseccomp2, rsync"
